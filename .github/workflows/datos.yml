name: Actualizar datos (videos y noticias)

# SOLO MANUAL por ahora: el trabajo automatico lo hace el VPS (scripts/vps-publicador/publicar_datos.py, cada 10 min),
# asi no depende de GitHub Actions ni de su facturacion. Para reactivar esta version, quita los '#' del bloque 'schedule'.
# Lo que hace (igual que el VPS):
#   - agrega a src/data/serie-bitget.json los nuevos "Dia N de 33 operando con Bitget" del canal
#     (se guarda en git para no perder los dias anteriores: el RSS de YouTube solo trae los ultimos 15)
#   - regenera src/data/noticias.json (no se guarda en git, solo se sube al hosting)
# Tambien se puede lanzar a mano desde la pestana Actions.

on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Actualizar videos y noticias
        run: python3 scripts/actualizar_datos.py

      - name: Guardar la serie de videos en git (solo si hay un día nuevo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/serie-bitget.json
          if git diff --cached --quiet; then
            echo "Sin días nuevos"
          else
            git commit -m "chore: actualizar serie Bitget [skip ci]"
            git push
          fi

      - name: Subir la carpeta data/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./src/data/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}data/
          state-name: .ftp-deploy-sync-state-datos.json

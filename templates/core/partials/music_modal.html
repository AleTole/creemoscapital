{% load static %}
<div id="music-modal-overlay" style="display:none;">
  <div id="music-modal">
    <div class="music-modal-icon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
    </div>
    <h3 class="font-display text-xl font-semibold text-white mb-2">Bienvenido a Creemos Capital</h3>
    <p class="text-slate-400 text-sm mb-6 leading-relaxed">¿Querés escuchar la música de la comunidad mientras navegás?</p>
    <div class="flex flex-col gap-3">
      <button onclick="activarMusica()" class="btn-primary justify-center" style="background:#00b8e0;box-shadow:0 4px 20px rgba(0,184,224,0.35);">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
        Sí, activar música
      </button>
      <button onclick="cerrarModal()" class="btn-outline justify-center text-sm py-2">
        No, gracias
      </button>
    </div>
  </div>
</div>
